<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中学国語　ことばの力</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#222;--sub:#667;--main:#2b6cb0;--ok:#2f855a;--ng:#c53030;--line:#e2ddd0;--kw:#fff3bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:17px;line-height:1.8}
#app{max-width:720px;margin:0 auto;padding:12px 14px 60px}
h1{font-size:22px;margin:8px 0 2px}
h2{font-size:18px;margin:0 0 6px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.streak{background:#fff7e0;border:1px solid #f1d98a;border-radius:12px;padding:8px 14px;margin:10px 0;font-weight:bold}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:20px;padding:4px 14px;font-size:15px;cursor:pointer}
.tag.on{background:var(--main);color:#fff}
button{font:inherit;cursor:pointer}
.unit{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.unit .t{font-weight:bold}
.badge{display:inline-block;font-size:12px;border-radius:10px;padding:0 8px;background:#e6eefb;color:var(--main);margin-right:6px}
.badge.理科{background:#e3f5ea;color:var(--ok)}
.badge.社会{background:#fdecd9;color:#b7570f}
.done{color:var(--ok);font-size:14px;white-space:nowrap}
.btn{background:var(--main);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin:6px 6px 0 0}
.btn.warn{background:#dd6b20}
.btn.line{background:#fff;color:var(--main);border:1px solid var(--main)}
.text{font-size:18px;line-height:2}
u.kw{text-decoration:none;background:var(--kw);border-bottom:2px solid #e6b800;padding:0 2px;font-weight:bold}
.kind{font-size:13px;color:#fff;background:var(--main);border-radius:6px;padding:1px 8px;margin-right:6px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.6}
.choice.right{border-color:var(--ok);background:#e9f7ef}
.choice.wrong{border-color:var(--ng);background:#fdeeee}
.choice:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:8px;padding:10px 12px;border-radius:10px;background:#f1f5fb}
.fb.ok b{color:var(--ok)}
.fb.ng b{color:var(--ng)}
.hint{margin:6px 0;font-size:15px;font-weight:bold;color:#9c4221;background:#fff1e0;border:2px dashed #ed8936;border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:18px;line-height:1.5;color:var(--ink)}
.chip.right{border-color:var(--ok);background:#e9f7ef}
.chip.wrong{border-color:var(--ng);background:#fdeeee}
.chip:disabled{cursor:default}
.tag.lv{border-radius:10px;font-weight:bold}
.para{margin-top:6px;font-size:15px;background:#fff8e6;border-radius:8px;padding:6px 10px}
.vocab{border-top:1px dashed var(--line);padding:8px 0}
.vocab b{font-size:19px}
.vocab .y{color:var(--sub);font-size:14px;margin-left:6px}
.rv .choice{margin:4px 0;padding:6px 10px;font-size:15px}
.pt{background:#eef7ee;border-radius:10px;padding:10px 12px;margin-top:10px}
.lk{background:#eef2fb;border-radius:10px;padding:10px 12px;margin-top:10px}
.nav{margin:6px 0}
a.back{color:var(--main);cursor:pointer;font-size:15px}
</style>
</head>
<body>
<div id="app">読みこみ中…</div>
<script>
const LS_DAYS = 'kokugo_days', LS_DONE = 'kokugo_done';
function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function markToday() { const days = load(LS_DAYS, []); const t = ymd(new Date()); if (!days.includes(t)) { days.push(t); save(LS_DAYS, days); } }
function streak() {
  const days = new Set(load(LS_DAYS, []));
  const d = new Date();
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function fmt(s) { return esc(s).replace(/【(.+?)】/g, '<u class="kw">$1</u>'); }
function shuffle(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let DATA = null, LEV = [], RULES = [], cur = 0, filter = '全部';
const LV_NAMES = ['レベル0　ことばの力', 'レベル1　1文を読む', 'レベル2　2文を読む', 'レベル3　まとめと具体', 'レベル4　長めの文章', 'レベル5　小説（気持ち）'];
const app = document.getElementById('app');

function streakHtml() {
  const n = streak();
  return '<div class="streak">' + (n >= 1 ? '🔥 ' + n + '日連続で頑張ってるよ！' : '🔥 今日から、1日ひとつずつやってみよう！') + '</div>';
}

function home() {
  DATA = LEV[cur];
  const done = load(LS_DONE, {});
  const tags = ['全部', '社会常識', '理科', '社会'];
  let h = '<div class="nav"><a class="back" href="https://chugaku.senta1111.workers.dev/">← 中学自習サイトのトップへ</a></div><h1>中学国語　ことばの力</h1><div class="sub">' + esc(DATA.title) + '　1回3分。文章を読んで、ことばと読み取りの力をつけよう。</div>' + streakHtml();
  h += '<button class="unit" id="rules" style="border:2px solid #ed8936;background:#fff8ee"><span><span class="t">📖 ことばのルール（最初に読もう）</span><br><span class="sub">「なぜ→〜から」「何ですか→〜こと」など、答えの終わり方</span></span></button>';
  h += '<div class="tags">' + LEV.map((L, i) => '<button class="tag lv' + (i === cur ? ' on' : '') + '" data-lv="' + i + '">' + esc(LV_NAMES[i]) + '</button>').join('') + '</div>';
  h += '<div class="tags">' + tags.map(t => '<button class="tag' + (t === filter ? ' on' : '') + '" data-tag="' + t + '">' + t + '</button>').join('') + '</div>';
  DATA.units.filter(u => filter === '全部' || u.tag === filter).forEach(u => {
    const d = done[u.id];
    h += '<button class="unit" data-id="' + u.id + '"><span><span class="badge ' + u.tag + '">' + u.tag + '</span><span class="t">' + esc(u.title) + '</span>' + (u.stage ? '<br><span class="sub">' + esc(u.stage) + '</span>' : '') + '</span><span class="done">' + (d !== undefined ? '✔ ' + d + '/' + u.questions.length : '') + '</span></button>';
  });
  h += '<div class="nav"><button class="btn line" id="rv">一覧で確認（全問の答えを見る）</button></div>';
  app.innerHTML = h;
  app.querySelectorAll('.tag[data-tag]').forEach(b => b.onclick = () => { filter = b.dataset.tag; home(); });
  app.querySelectorAll('.tag[data-lv]').forEach(b => b.onclick = () => { cur = +b.dataset.lv; home(); });
  app.querySelectorAll('.unit[data-id]').forEach(b => b.onclick = () => startUnit(b.dataset.id));
  document.getElementById('rules').onclick = () => rules(null, false);
  document.getElementById('rv').onclick = review;
  window.scrollTo(0, 0);
}

let S = null;
function startUnit(id) {
  const u = LEV.flatMap(L => L.units).find(x => x.id === id);
  S = { u, qi: 0, score: 0, answered: false };
  question();
}

function head(u) {
  return '<div class="nav"><a class="back" id="bk">← もどる</a></div><span class="badge ' + u.tag + '">' + u.tag + '</span><h2 style="display:inline">' + esc(u.title) + '</h2>' +
    '<div class="card text">' + fmt(u.text) + '</div>';
}

function question(keep) {
  const { u, qi } = S;
  const q = u.questions[qi];
  if (!keep) { S.order = q.type === 'tap' ? null : shuffle(q.choices.length); S.answered = false; S.pick = null; }
  let h = head(u);
  h += '<div class="card"><div class="sub">' + (qi + 1) + ' / ' + u.questions.length + '</div>';
  h += '<p><span class="kind">' + esc(q.kind) + '</span>' + esc(q.q) + '</p>';
  if (q.hint) h += '<div class="hint">' + esc(q.hint) + '</div>';
  h += '<div id="cs">';
  if (q.type === 'tap') {
    h += '<div class="chips">' + q.chunks.map((c, k) => '<button class="chip" data-k="' + k + '">' + esc(c) + '</button>').join('') + '</div>';
  } else {
    S.order.forEach((oi, k) => { h += '<button class="choice" data-k="' + k + '">' + esc(q.choices[oi]) + '</button>'; });
  }
  h += '</div><div id="fb"></div></div>';
  app.innerHTML = h;
  document.getElementById('bk').onclick = home;
  app.querySelectorAll('.choice, .chip').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (keep && S.answered) paint(S.pick); else window.scrollTo(0, 0);
}

function answer(k) {
  if (S.answered) return;
  S.answered = true;
  S.pick = k;
  markToday();
  const q = S.u.questions[S.qi];
  const ok = q.type === 'tap' ? k === q.tapAns : S.order[k] === q.ans;
  if (ok) S.score++;
  paint(k);
}

function paint(k) {
  const q = S.u.questions[S.qi];
  const tap = q.type === 'tap';
  const ok = tap ? k === q.tapAns : S.order[k] === q.ans;
  if (tap) {
    app.querySelectorAll('.chip').forEach((b, i) => {
      b.disabled = true;
      if (i === q.tapAns) b.classList.add('right');
      else if (i === k) b.classList.add('wrong');
    });
  } else {
    app.querySelectorAll('.choice').forEach((b, i) => {
      b.disabled = true;
      if (S.order[i] === q.ans) b.classList.add('right');
      else if (i === k) b.classList.add('wrong');
    });
  }
  let f = '<div class="fb ' + (ok ? 'ok' : 'ng') + '"><b>' + (ok ? '○ 正解！' : '× ざんねん') + '</b><br>' + esc(q.exp);
  if (q.para && q.para.length) {
    f += '<div class="para">💡 言いかえに注目：' + q.para.map(p => '本文の「' + esc(p[0]) + '」→「' + esc(p[1]) + '」').join('、') + '</div>';
  }
  f += '</div>';
  if (!ok && q.rule) f += '<button class="btn warn" id="rl">📖 ことばのルールを見て、もう一度たしかめる</button>';
  const last = S.qi === S.u.questions.length - 1;
  f += '<button class="btn" id="nx">' + (last ? '結果と解説を見る' : '次の問題へ') + '</button>';
  document.getElementById('fb').innerHTML = f;
  document.getElementById('nx').onclick = () => { if (last) finish(); else { S.qi++; question(); } };
  const rl = document.getElementById('rl');
  if (rl) rl.onclick = () => rules(q.rule, true);
}

function rules(focus, fromQ) {
  let h = '<div class="nav"><a class="back" id="bk">' + (fromQ ? '← 問題にもどる' : '← もどる') + '</a></div>';
  h += '<h1>📖 ことばのルール</h1><div class="sub">答えの「終わり方」には決まりがあります。問題を解く前に読んで、まちがえたらここにもどってこよう。</div>';
  RULES.forEach((r, i) => {
    h += '<div class="card rule" id="r-' + r.id + '"><h2>' + (i + 1) + '. ' + esc(r.title) + '</h2>';
    h += '<div class="sub">こんな問い：' + r.ask.map(esc).join('　／　') + '</div>';
    h += '<div class="para" style="font-size:16px">答えの終わり方：<b>' + esc(r.end) + '</b></div>';
    h += '<div class="fb ok" style="margin-top:8px"><b>○</b> ' + esc(r.ok) + '</div>';
    r.ng.forEach(n => { h += '<div class="fb ng" style="margin-top:6px"><b>×</b> ' + esc(n) + '</div>'; });
    h += '<div class="pt">💡 ' + esc(r.tip) + '</div></div>';
  });
  if (fromQ) h += '<button class="btn" id="bk2">問題にもどる</button>';
  app.innerHTML = h;
  const back = () => { if (fromQ) question(true); else home(); };
  document.getElementById('bk').onclick = back;
  const b2 = document.getElementById('bk2'); if (b2) b2.onclick = back;
  const el = focus && document.getElementById('r-' + focus);
  if (el) { el.style.outline = '3px solid #ed8936'; el.scrollIntoView(); } else window.scrollTo(0, 0);
}

function vocabHtml(u) {
  const rev = (u.review && u.review.length)
    ? '<h2 style="margin-top:12px">🔁 復習ことば（前に出たことば）</h2>' + u.review.map(r => '<div class="vocab"><b>' + esc(r.w) + '</b><span class="y">' + esc(r.yomi) + '</span><br>' + esc(r.mean) + '</div>').join('')
    : '';
  return u.vocab.map(v => '<div class="vocab"><b>' + esc(v.w) + '</b><span class="y">' + esc(v.yomi) + '</span><br>' + esc(v.mean) + '<br><span class="sub">例：' + esc(v.ex) + '</span></div>').join('') + rev;
}

function finish() {
  const { u, score } = S;
  const done = load(LS_DONE, {});
  if (done[u.id] === undefined || score > done[u.id]) done[u.id] = score;
  save(LS_DONE, done);
  markToday();
  let h = head(u);
  h += '<div class="card"><h2>結果：' + score + ' / ' + u.questions.length + '</h2>';
  h += '<h2 style="margin-top:12px">ことばカード</h2>' + vocabHtml(u);
  h += '<div class="pt">📌 ' + esc(u.point) + '</div><div class="lk">📚 ' + esc(u.link) + '</div></div>';
  h += '<button class="btn" id="again">もう一度</button><button class="btn line" id="hm">一覧にもどる</button>';
  app.innerHTML = h;
  document.getElementById('bk').onclick = home;
  document.getElementById('hm').onclick = home;
  document.getElementById('again').onclick = () => startUnit(u.id);
  window.scrollTo(0, 0);
}

let rvTag = '全部';
function review() {
  const units = DATA.units.filter(u => rvTag === '全部' || u.tag === rvTag);
  let h = '<div class="nav"><a class="back" id="bk">← もどる</a></div><h1>👩‍🏫 一覧で確認（先生用）</h1><div class="sub">' + esc(LV_NAMES[cur]) + '：全ユニットの文章・問題・答え・解説をまとめて見られます（○がついた選択肢が正解）。いまの表示：' + units.length + 'ユニット／' + units.reduce((a, u) => a + u.questions.length, 0) + '問</div>';
  h += '<div class="tags">' + ['全部', '社会常識', '理科', '社会'].map(t => '<button class="tag' + (t === rvTag ? ' on' : '') + '" data-tag="' + t + '">' + t + '</button>').join('') + '</div>';
  units.forEach(u => {
    h += '<div class="card rv"><span class="badge ' + u.tag + '">' + u.tag + '</span><h2 style="display:inline">' + esc(u.id) + '　' + esc(u.title) + '</h2>';
    h += '<div class="text" style="font-size:16px;line-height:1.9;margin:8px 0">' + fmt(u.text) + '</div>';
    u.questions.forEach((q, i) => {
      h += '<p style="margin:10px 0 2px"><span class="kind">' + esc(q.kind) + '</span>' + (i + 1) + '. ' + esc(q.q) + '</p>';
      if (q.hint) h += '<div class="hint">' + esc(q.hint) + '</div>';
      if (q.type === 'tap') {
        h += '<div class="chips">' + q.chunks.map((c, j) => '<span class="chip' + (j === q.tapAns ? ' right' : '') + '">' + (j === q.tapAns ? '○ ' : '') + esc(c) + '</span>').join('') + '</div>';
      } else {
        q.choices.forEach((c, j) => { h += '<div class="choice' + (j === q.ans ? ' right' : '') + '">' + (j === q.ans ? '○ ' : '') + esc(c) + '</div>'; });
      }
      h += '<div class="sub">' + esc(q.exp) + '</div>';
      if (q.para && q.para.length) h += '<div class="para">💡 ' + q.para.map(p => '「' + esc(p[0]) + '」→「' + esc(p[1]) + '」').join('、') + '</div>';
    });
    h += '<h2 style="margin-top:12px">ことばカード</h2>' + vocabHtml(u);
    h += '<div class="pt">📌 ' + esc(u.point) + '</div><div class="lk">📚 ' + esc(u.link) + '</div></div>';
  });
  app.innerHTML = h;
  document.getElementById('bk').onclick = home;
  app.querySelectorAll('.tag').forEach(b => b.onclick = () => { rvTag = b.dataset.tag; review(); });
  window.scrollTo(0, 0);
}

Promise.all(['data/level0.json', 'data/level1.json', 'data/level2.json', 'data/level3.json', 'data/level4.json', 'data/level5.json'].map(f => fetch(f).then(r => r.json())))
  .then(ls => { LEV = ls; RULES = ls[0].rules; DATA = LEV[cur]; home(); })
  .catch(() => { app.textContent = 'データを読みこめませんでした。'; });
</script>
</body>
</html>
